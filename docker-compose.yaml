version: "3.8"

services:
  wallet:
    image: novapay-wallet:local
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_VERSION=0.1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    user: "10001:10001"   # force non-root

  # Optional: LocalStack for Terraform apply
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb,secretsmanager,iam,ec2
      - DEBUG=0
